<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — hairly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">hairly</a>
    <nav class="nav" aria-label="เมนูหลัก">
      <a href="index.html">หน้าแรก</a>
      <a href="product.html">สินค้า</a>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1 class="heading-rule text-center">สั่งซื้อสินค้า</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form id="orderForm" class="order-form">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="off" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="numeric" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ (ถ้ามี)</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>&copy; 2026 hairly</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
